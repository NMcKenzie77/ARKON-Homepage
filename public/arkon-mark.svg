<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" role="img" aria-labelledby="title desc">
  <title id="title">ARKON Systems mark</title>
  <desc id="desc">A stylized letter A inside a rounded blue and mint square.</desc>
  <defs>
    <linearGradient id="arkonMark" x1="4" y1="4" x2="60" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#67D8FF"/>
      <stop offset="1" stop-color="#82F7CA"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.8" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.403 0 0 0 0 0.847 0 0 0 0 1 0 0 0 .32 0" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#softGlow)">
    <rect x="6" y="6" width="52" height="52" rx="15" fill="url(#arkonMark)"/>
    <path d="M32 17L48 47H40.4L37.4 41H26.6L23.6 47H16L32 17ZM29.3 34.8H34.7L32 29.2L29.3 34.8Z" fill="#06111F"/>
