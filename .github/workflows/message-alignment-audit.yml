name: Message Alignment Audit

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build public site
        run: npm run build

      - name: Reject retired public positioning
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE "digital AI team|AI Workflow Automation|AI workflow automation" dist server.runtime.js src/App.public.jsx; then
            echo "Retired public positioning remains in rendered output."
            exit 1
          fi

      - name: Confirm digital-team positioning
        shell: bash
        run: |
          set -euo pipefail
          grep -q "Digital Team for Service Businesses" dist/index.html
          grep -q "A digital team for service businesses" server.runtime.js
          grep -q "Real estate digital team" dist/assets/*.js
          grep -q "Insurance agency digital team" dist/assets/*.js
          grep -q "Short-term rental digital team" dist/assets/*.js
          grep -q "Salon digital team" dist/assets/*.js
          grep -q "Auto repair digital team" dist/assets/*.js
