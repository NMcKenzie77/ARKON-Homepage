name: Remove Homepage Coverage

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded removal
        run: node scripts/apply-remove-homepage-coverage.mjs

      - name: Commit source cleanup
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/homepage-spacing.css server.js scripts/build-public-source.mjs
          git commit -m "Remove homepage Coverage section"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install locked dependencies
        run: npm ci

      - name: Build public site
        run: npm run build

      - name: Confirm Coverage is absent
        shell: bash
        run: |
          ! grep -R "The work behind each response" dist server.runtime.js src/App.public.jsx
          ! grep -R "One customer experience. The right role behind each step." dist server.runtime.js src/App.public.jsx
