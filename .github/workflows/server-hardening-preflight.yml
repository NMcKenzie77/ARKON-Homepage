name: Server Hardening Preflight

on:
  push:
    branches:
      - work/server-hardening-2026-08-01

permissions:
  contents: write

jobs:
  harden-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out work branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply server hardening
        run: node scripts/apply-server-hardening.mjs

      - name: Resolve dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Pin resolved dependency versions
        run: node scripts/pin-resolved-dependencies.mjs

      - name: Refresh dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Install locked dependencies
        run: npm ci

      - name: Build public site
        run: npm run build

      - name: Audit hardened server
        run: npm run audit:server

      - name: Remove temporary migration files
        run: |
          rm scripts/apply-server-hardening.mjs
          rm scripts/pin-resolved-dependencies.mjs
          rm .github/workflows/server-hardening-preflight.yml

      - name: Commit audited hardening changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Harden public server and demo endpoint"
          git push origin HEAD:work/server-hardening-2026-08-01
