name: Live Homepage Spacing Audit

# Final run against the rendered-app-scoped staging deployment.
on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  live-spacing-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install audit tools
        run: npm install --no-save --package-lock=false playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit live staging homepage spacing
        env:
          AUDIT_BASE_URL: https://arkon-homepage-staging.up.railway.app/
        run: node scripts/audit-live-homepage-spacing.mjs

      - name: Upload spacing report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: homepage-spacing-audit
          path: homepage-spacing-audit
          retention-days: 7
