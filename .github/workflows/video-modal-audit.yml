name: Video Modal Audit

on:
  pull_request:
    branches: [staging]

jobs:
  audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Validate video card and modal
        run: node scripts/video-modal-audit.mjs

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arkon-video-modal-audit
          path: video-modal-output
          if-no-files-found: warn
          retention-days: 7
