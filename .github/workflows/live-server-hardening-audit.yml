name: Live Server Hardening Audit

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: read

jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out audit branch
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Audit live Railway staging
        run: node scripts/live-server-hardening-audit.mjs
