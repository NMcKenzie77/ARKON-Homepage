name: Accessibility Cleanup Audit

on:
  pull_request:
    branches:
      - staging

permissions:
  contents: write

jobs:
  apply-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply guarded cleanup
        run: node scripts/apply-accessibility-cleanup.mjs

      - name: Commit generated source fixes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "Accessibility source fixes are already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js src/App.jsx src/RealEstateCallDemo.jsx src/InsuranceCallDemo.jsx src/ShortTermRentalCallDemo.jsx src/real-estate-dashboard-preview.css src/*.jsx
          git commit -m "Apply accessibility cleanup"
          git push origin HEAD:${{ github.head_ref }}

      - name: Install locked dependencies
        run: npm ci

      - name: Build public site
        run: npm run build

      - name: Install accessibility test tools
        run: npm install --no-save --package-lock=false playwright @axe-core/playwright

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start local public server
        shell: bash
        run: |
          PORT=4173 APP_ENV=staging npm start > /tmp/arkon-accessibility-server.log 2>&1 &
          echo $! > /tmp/arkon-accessibility-server.pid
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/arkon-accessibility-server.log
          exit 1

      - name: Run accessibility audit
        run: AUDIT_BASE_URL=http://127.0.0.1:4173 node scripts/audit-accessibility-cleanup.mjs
