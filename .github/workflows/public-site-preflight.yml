name: Public Site Preflight

on:
  pull_request:
    branches:
      - staging
      - main

permissions:
  contents: read

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed change
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build public site
        run: npm run build

      - name: Audit hardened server
        run: npm run audit:server
